apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-flag-app
  labels:
    app: feature-flag-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feature-flag-app
  template:
    metadata:
      labels:
        app: feature-flag-app
    spec:
      containers:
      - name: feature-flag-app
        image: snesh111/feature-flag-ci-cd-aws:latest
        ports:
        - containerPort: 5000
