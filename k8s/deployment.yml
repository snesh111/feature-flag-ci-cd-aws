apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-flag-app
  labels:
    app: feature-flag-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feature-flag-app
  template:
    metadata:
      labels:
        app: feature-flag-app
    spec:
      containers:
        - name: feature-flag-app
          image: snesh111/feature-flag-app:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
