apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: feature-flag-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/snesh111/feature-flag-ci-cd-aws.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
